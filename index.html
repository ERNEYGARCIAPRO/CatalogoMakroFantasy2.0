<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKROFANTASY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <!-- LADO IZQUIERDO: LOGO -->
    <div class="header-brand">
        <h1>
            <span class="logo-makro">Makro</span><span class="logo-fantasy">Fantasy</span>
        </h1>
        <p>Calidad al Por Mayor,  Magia al <span class="lema">Detalle</span>!</p>   
          <h3>CATALOGO</h3>
    </div>

    <!-- LADO DERECHO: ACCIONES DERECHA -->
    <div class="header-actions">
        <!-- Campo de Búsqueda -->
        <input type="text" id="buscador" placeholder="Buscar..." autocomplete="off">

        <!-- Selector de Categoría compacto -->
        <select id="filtro-categoria" class="select-categoria">
            <option value="todos">Todas</option>
            <option value="Hogar">Hogar</option>
            <option value="Tecnología">Tecno</option>
            <option value="Belleza">Belleza</option>
        </select>
    </div>
</header>
<!-- CONTENEDOR PRINCIPAL (SE LLENA DINOÁMICAMENTE DESDE JS) -->
    <main id="catalogo-container" class="catalogo-container">
        <!-- Las tarjetas se generan automáticamente aquí -->
    </main>

    <!-- LIGHTBOX PARA VISTA A PANTALLA COMPLETA -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Vista ampliada">
    </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
