<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKROFANTASY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <!-- LADO IZQUIERDO: LOGO Y CARRITO-->
    <div class="header-brand">
        <!-- BOTÓN FLOTANTE DEL CARRITO -->
        <button id="btn-carrito" class="btn-carrito-flotante" title="Ver Carrito">
        🛒
        <span id="carrito-contador">0</span>
        </button>
        <!-- BLOQUE DE TEXTO DEL LOGO -->
        <div class="brand-text">
            <h1>
                <span class="logo-makro">Makro</span><span class="logo-fantasy">Fantasy</span>
            </h1>
            <p>Calidad al Por Mayor, Magia al <span class="lema">Detalle</span>!</p>    
            <h3>CATÁLOGO</h3>
        </div>
    </div>

    <!-- LADO DERECHO: ACCIONES DERECHA -->
    <div class="header-actions">
        <!-- Campo de Búsqueda -->
        <input type="text" id="buscador" placeholder="Buscar..." autocomplete="off">

        <!-- Selector de Categoría compacto -->
        <select id="filtro-categoria" class="select-categoria">
            <option value="todos">Todas</option>
            <option value="Hogar">Hogar</option>
            <option value="Tecnología">Tecno</option>
            <option value="Belleza">Belleza</option>
        </select>
    </div>
</header>
<!-- CONTENEDOR PRINCIPAL (SE LLENA DINÁMICAMENTE DESDE JS) -->
    <main id="catalogo-container" class="catalogo-container">
        <!-- Las tarjetas se generan automáticamente aquí -->
    </main>

    <!-- LIGHTBOX PARA VISTA A PANTALLA COMPLETA -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Vista ampliada">
    </div>
    </main>
    
    <!-- PANEL LATERAL DEL CARRITO -->
    <aside id="panel-carrito" class="panel-carrito" aria-hidden="true">
        <div class="carrito-header">
            <h2>Tu Carrito</h2>
            <button id="cerrar-carrito" class="btn-cerrar-carrito" aria-label="Cerrar carrito">&times;</button>
        </div>
        
        <div id="carrito-items" class="carrito-body">
            <!-- Los productos agregados se renderizarán dinámicamente aquí -->
        </div>

        <div class="carrito-footer">
            <div class="carrito-total">
                <span>Total estimado:</span>
                <span id="carrito-total-precio">$0 COP</span>
            </div>
            <button id="btn-enviar-whatsapp" class="btn-enviar-wa">
                Pedir por WhatsApp
            </button>
        </div>
    </aside>

    <!-- CAPA OSCURA DE FONDO (OVERLAY) -->
    <div id="carrito-overlay" class="carrito-overlay"></div>

    <script src="script.js"></script>

</body>
</html>
